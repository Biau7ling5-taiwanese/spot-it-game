<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Spot It!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden; /* 保證無捲軸、一頁全覽 */
    background-color: #111322;
    color: #ffffff;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: clamp(3px, 0.8vh, 8px) clamp(8px, 1.5vw, 20px);
  }

  /* 🌟🌟🌟 頂部整合控制列：緊湊居中，徹底消弭兩側大段留白 🌟🌟🌟 */
  .unified-bar-wrap {
    background: #181b36;
    border: 1px solid #2d335c;
    border-radius: 10px;
    padding: 3px clamp(8px, 1.2vw, 14px);
    width: fit-content; /* 關鍵：自適應收緊，不隨意向兩側盲目拉扯留白 */
    max-width: 98vw;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    flex-shrink: 0;
    margin: 2px auto clamp(2px, 0.5vh, 5px) auto;
    position: relative;
    z-index: 200;
  }
  .unified-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 1.2vw, 16px);
  }

  /* 🌟 霸氣顯眼：Spot It! 遊戲標誌與立體放大鏡插圖 🌟 */
  .brand-logo-area {
    display: flex;
    align-items: center;
    gap: 7px;
    padding-right: 10px;
    border-right: 1.5px solid #2e3561;
    flex-shrink: 0;
    user-select: none;
  }
  .brand-title {
    font-size: clamp(20px, 2.8vh, 26px); /* 大字級，醒目不突兀 */
    font-weight: 900;
    font-family: 'Arial Rounded MT Bold', 'Nunito', 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, #fff3b0 0%, #ffb300 45%, #ff6f00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 1.2px;
    filter: drop-shadow(0 2px 0 #b23b00) drop-shadow(0 3px 8px rgba(255, 152, 0, 0.5));
    white-space: nowrap;
  }
  .brand-icon {
    width: clamp(22px, 3vh, 28px);
    height: clamp(22px, 3vh, 28px);
    filter: drop-shadow(0 3px 6px rgba(255, 179, 0, 0.6));
    animation: wiggle 3s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-6deg) scale(1); }
    50% { transform: rotate(14deg) scale(1.1); }
  }

  /* 中間參數區：緊湊排列 */
  .bar-center-group {
    display: flex;
    align-items: center;
    gap: clamp(6px, 1vw, 12px);
  }

  .param-item { display: flex; align-items: center; gap: 4px; }
  .param-label { color: #9fa8da; font-weight: bold; font-size: clamp(10.5px, 1vw, 12px); }

  select, input[type="number"] {
    background: #23274c;
    color: #fff;
    border: 1px solid #3f477c;
    padding: 3px 6px;
    border-radius: 5px;
    font-size: clamp(10.5px, 1vw, 12px);
    outline: none;
  }
  #theme-select { border-color: #ff9800; color: #ffd54f; font-weight: bold; }
  input[type="number"] { width: 44px; text-align: center; }

  .round-pill {
    background: #0d0f1e;
    border: 1px solid #ff9800;
    padding: 2px 7px;
    border-radius: 12px;
    color: #ff9800;
    font-weight: bold;
    font-size: clamp(10px, 0.95vw, 11.5px);
  }
  .status-tag {
    color: #80cbc4;
    font-size: clamp(10px, 0.95vw, 11.5px);
    font-weight: bold;
    background: rgba(0, 150, 136, 0.15);
    padding: 2px 7px;
    border-radius: 4px;
    border: 1px solid rgba(0, 150, 136, 0.35);
    white-space: nowrap;
  }

  /* 右側功能按鈕 */
  .right-icons {
    display: flex;
    align-items: center;
    gap: 4px;
    padding-left: 8px;
    border-left: 1.5px solid #2e3561;
    flex-shrink: 0;
  }
  .icon-btn {
    position: relative;
    width: clamp(26px, 2.6vw, 30px);
    height: clamp(26px, 2.6vw, 30px);
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(12px, 1.2vw, 14px);
    transition: transform 0.15s, background-color 0.2s;
  }
  .icon-btn:active { transform: scale(0.92); }

  .btn-scoreboard-toggle { background: rgba(255, 152, 0, 0.22); border-color: rgba(255, 152, 0, 0.45); color: #ffb74d; }
  .btn-scoreboard-toggle.active { background: rgba(255, 152, 0, 0.6); border-color: #ff9800; }
  .btn-upload { background: rgba(46, 125, 50, 0.25); border-color: rgba(76, 175, 80, 0.45); color: #81c784; }
  .btn-sync { background: rgba(0, 150, 136, 0.25); border-color: rgba(38, 166, 154, 0.45); color: #80cbc4; }
  .btn-view { background: rgba(124, 77, 255, 0.22); border-color: rgba(179, 136, 255, 0.45); color: #d1c4e9; }
  .btn-clear { background: rgba(211, 47, 47, 0.22); border-color: rgba(239, 83, 80, 0.45); color: #ef9a9a; }

  .icon-btn::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 6px) !important;
    top: auto !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    background: rgba(12, 15, 33, 0.96);
    color: #e0e7ff;
    padding: 3px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: bold;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    border: 1px solid #3d467c;
    z-index: 999 !important;
  }
  .icon-btn:hover::after { opacity: 1 !important; }

  /* 縮圖抽屜 */
  .thumb-drawer {
    display: none;
    flex-wrap: wrap;
    gap: 5px;
    max-height: 70px;
    overflow-y: auto;
    margin-top: 4px;
    padding-top: 4px;
    border-top: 1px dashed #2d335c;
  }
  .thumb-item {
    position: relative;
    width: 40px;
    height: 40px;
    background: #ffffff;
    border-radius: 4px;
    border: 1px solid #4a5180;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .thumb-item img { max-width: 86%; max-height: 86%; object-fit: contain; mix-blend-mode: multiply; }
  .thumb-del {
    position: absolute;
    top: -4px;
    right: -4px;
    background: #ef4444;
    color: white;
    border: 1.5px solid #181b36;
    border-radius: 50%;
    width: 14px;
    height: 14px;
    font-size: 10px;
    line-height: 12px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 緊湊膠囊計分列 */
  .scoreboard-compact-wrap {
    display: none;
    width: fit-content;
    max-width: 98vw;
    margin: 1px auto clamp(2px, 0.4vh, 4px) auto;
    background: rgba(22, 26, 54, 0.96);
    border: 1.5px solid #ff9800;
    border-radius: 30px;
    padding: 3px 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    flex-shrink: 0;
    z-index: 250;
    animation: fadeIn 0.2s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }

  .scoreboard-inner-flex {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .scoreboard-setting-side {
    display: flex;
    align-items: center;
    gap: 4px;
    padding-right: 6px;
    border-right: 1px solid #3f477c;
  }
  .scoreboard {
    display: flex;
    gap: 5px;
    align-items: center;
    justify-content: center;
    overflow-x: auto;
    padding: 1px 2px;
  }
  .team-card {
    background: #141730;
    border: 1px solid #2d335c;
    border-radius: 5px;
    padding: 2px 5px;
    min-width: 58px;
    text-align: center;
    flex-shrink: 0;
  }
  .team-title { color: #ff9800; font-size: 10px; font-weight: bold; margin-bottom: 1px; }
  .score-display {
    background: #0c0d17;
    color: #00e676;
    font-size: 14px;
    font-weight: bold;
    border-radius: 3px;
    padding: 0 3px;
    margin-bottom: 1px;
    font-family: monospace;
    line-height: 1.2;
  }
  .btn-score {
    background: #2b305c;
    color: #fff;
    border: none;
    width: 17px;
    height: 15px;
    border-radius: 3px;
    font-weight: bold;
    cursor: pointer;
    font-size: 10px;
    line-height: 1;
  }
  .btn-score:hover { background: #3c4482; }

  .scoreboard-close-btn {
    background: transparent;
    border: none;
    color: #9fa8da;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scoreboard-close-btn:hover { background: rgba(239, 68, 68, 0.3); color: #ff8a80; }

  /* 🌟🌟🌟 核心主舞台：絕對隔離排版，保證雙圓盤「永不重疊」右側按鈕 🌟🌟🌟 */
  .stage-wrapper {
    flex: 1 1 0;
    width: 100%;
    max-width: 1400px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding-right: 70px; /* 關鍵：強制為右側按鈕群預留專屬走廊，圓盤絕無可能越界！ */
    min-height: 0;
  }

  .arena {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 2.5vw, 36px);
    width: 100%;
    height: 100%;
    max-height: 100%;
  }

  /* 圓盤自適應正圓：以剩餘寬高精算最大值，徹底杜絕外溢與碰擦 */
  .dobble-disk {
    width: min(calc(49vw - 45px), calc(100vh - 100px), 520px);
    height: min(calc(49vw - 45px), calc(100vh - 100px), 520px);
    max-height: 98%;
    background: #ffffff !important;
    border-radius: 50%;
    border: clamp(4px, 0.8vh, 8px) solid #ff9800;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 clamp(15px, 2.5vw, 30px) rgba(255, 152, 0, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    aspect-ratio: 1 / 1;
    transition: width 0.15s ease, height 0.15s ease;
  }
  .empty-msg { color: #7b8199; font-size: clamp(12px, 1.4vw, 15px); font-weight: bold; text-align: center; }

  .symbol-item {
    position: absolute;
    transform-origin: center center;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    will-change: transform, left, top;
  }
  .symbol-item img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    mix-blend-mode: multiply !important;
  }
  .symbol-fallback {
    font-size: clamp(11px, 1.3vw, 14px);
    font-weight: bold;
    color: #222;
    background: #f1f3f5;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 2px 4px;
    text-align: center;
    white-space: nowrap;
  }

  /* 🌟 獨立右側操作面板：定位在專屬保留區內，絕不受圓盤擠壓 🌟 */
  .side-action-panel {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.6vh, 16px);
    background: #161830;
    padding: clamp(6px, 1.2vh, 12px) clamp(5px, 0.8vw, 8px);
    border-radius: 12px;
    border: 1px solid #2d325a;
    box-shadow: 0 4px 18px rgba(0,0,0,0.45);
    flex-shrink: 0;
    z-index: 100;
  }
  .side-icon-btn {
    position: relative;
    width: clamp(38px, 5vh, 50px);
    height: clamp(38px, 5vh, 50px);
    font-size: clamp(17px, 2.4vh, 23px);
    border-radius: 8px;
    border: 1.5px solid transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, background-color 0.2s;
  }
  .side-icon-btn:active { transform: scale(0.92); }
  .btn-draw { background: rgba(33, 150, 243, 0.2); border-color: rgba(100, 181, 246, 0.45); }
  .btn-reset { background: rgba(244, 67, 54, 0.2); border-color: rgba(229, 115, 115, 0.45); }
  .btn-podium { background: rgba(255, 179, 0, 0.2); border-color: rgba(255, 213, 79, 0.45); }
  .btn-podium.playing { animation: pulseGlow 1.2s infinite; border-color: #ffd54f; }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 10px rgba(255, 179, 0, 0.4); transform: scale(1); }
    50% { box-shadow: 0 0 20px rgba(255, 179, 0, 0.9); transform: scale(1.06); }
  }

  .side-icon-btn::before {
    content: attr(data-tooltip);
    position: absolute;
    right: calc(100% + 10px) !important; /* 🌟 向左側彈出，絕不跑出螢幕外 */
    left: auto !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    background: rgba(10, 13, 28, 0.98);
    color: #ffd54f;
    padding: 5px 9px;
    border-radius: 5px;
    font-size: 11.5px;
    font-weight: bold;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    border: 1px solid #ff9800;
    z-index: 999;
  }
  .side-icon-btn:hover::before { opacity: 1; }

  /* 📱 直立手機/平板適配 */
  @media (orientation: portrait) or (max-width: 768px) {
    .stage-wrapper {
      padding-right: 0;
      flex-direction: column;
      gap: 6px;
    }
    .arena { flex-direction: column; gap: 6px; }
    .dobble-disk {
      width: min(80vw, calc(40vh - 40px), 320px);
      height: min(80vw, calc(40vh - 40px), 320px);
    }
    .side-action-panel {
      position: static;
      transform: none;
      flex-direction: row;
      gap: 14px;
      padding: 4px 12px;
    }
    .side-icon-btn::before {
      left: 50% !important;
      right: auto !important;
      top: -36px !important;
      transform: translateX(-50%) !important;
    }
  }
</style>
</head>
<body>

  <!-- 🌟 頂部一體化控制列（緊湊居中，左側為超顯眼 Spot It! 品牌標誌） 🌟 -->
  <div class="unified-bar-wrap">
    <div class="unified-bar">
      <!-- 顯眼品牌標誌與活潑插圖 -->
      <div class="brand-logo-area">
        <svg class="brand-icon" viewBox="0 0 64 64" fill="none">
          <circle cx="28" cy="28" r="18" stroke="#ffb300" stroke-width="7" fill="#ffe082"/>
          <path d="M41 41L54 54" stroke="#ff7043" stroke-width="8" stroke-linecap="round"/>
        </svg>
        <span class="brand-title">Spot It!</span>
      </div>

      <!-- 緊湊參數設定區 -->
      <div class="bar-center-group">
        <div class="param-item">
          <span class="param-label">主題</span>
          <select id="theme-select" onchange="onThemeChange()">
            <option value="moon_festival" selected>🥮 中秋節</option>
          </select>
        </div>

        <div class="param-item">
          <span class="param-label">模式</span>
          <select id="mode-select" onchange="onModeChange()">
            <option value="3">4圖/卡 (13張圖)</option>
            <option value="5" selected>6圖/卡 (31張圖)</option>
            <option value="7">8圖/卡 (57張圖)</option>
          </select>
        </div>

        <div class="param-item">
          <span class="param-label">總回合</span>
          <input type="number" id="total-rounds" min="1" max="50" value="20" onchange="updateRoundBadge()">
        </div>

        <div class="round-pill" id="round-indicator">0 / 20</div>
        <div class="status-tag" id="gallery-status">⚡ 準備連線中...</div>
      </div>

      <!-- 右側功能按鈕群 -->
      <div class="right-icons">
        <button class="icon-btn btn-scoreboard-toggle" id="btn-toggle-score" data-tooltip="🧮 計分板開關" onclick="toggleScoreboardPanel()">🧮</button>
        <label for="img-input" class="icon-btn btn-upload" data-tooltip="➕ 上傳圖片">➕</label>
        <input type="file" id="img-input" multiple accept="image/*" style="display:none;">
        <button class="icon-btn btn-sync" data-tooltip="🔄 重新載入" onclick="fetchImagesFromGitHub()">🔄</button>
        <button class="icon-btn btn-view" data-tooltip="👁️ 檢視與收闔" onclick="toggleThumbList()">👁️</button>
        <button class="icon-btn btn-clear" data-tooltip="🗑️ 清空圖片" onclick="clearAllImages()">🗑️</button>
      </div>
    </div>

    <div class="thumb-drawer" id="thumb-container"></div>
  </div>

  <!-- 緊湊零留白膠囊計分列 -->
  <div class="scoreboard-compact-wrap" id="scoreboard-panel">
    <div class="scoreboard-inner-flex">
      <div class="scoreboard-setting-side">
        <span class="param-label" style="color:#ffb74d;">組數</span>
        <input type="number" id="team-count" min="1" max="12" value="6" onchange="renderScoreboard()">
      </div>
      <div class="scoreboard" id="scoreboard"></div>
      <button class="scoreboard-close-btn" onclick="toggleScoreboardPanel()" title="收合計分板">✕</button>
    </div>
  </div>

  <!-- 🌟 核心主舞台：與右側按鈕絕對隔離，圓盤享有專屬滿版空間 🌟 -->
  <div class="stage-wrapper">
    <div class="arena">
      <div class="dobble-disk" id="disk-left"><span class="empty-msg">點擊「🎲」下一題</span></div>
      <div class="dobble-disk" id="disk-right"><span class="empty-msg">點擊「🎲」下一題</span></div>
    </div>

    <!-- 獨立保留區內的操作按鈕（永不與圓盤重疊） -->
    <div class="side-action-panel">
      <button class="side-icon-btn btn-draw" data-tooltip="🎲 抽下一題" onclick="drawNextPair()">🎲</button>
      <button class="side-icon-btn btn-reset" data-tooltip="🔄 重新開始" onclick="resetGame()">🔄</button>
      <button class="side-icon-btn btn-podium" id="btn-podium-music" data-tooltip="🏆 頒獎" onclick="toggleVictoryMusic()">🏆</button>
    </div>
  </div>

<script>
  const itemDefinitions = [
    { name: "打火機", keys: ["lài-tah", "lai-tah"], defaultFileName: "lài-tah.png" },
    { name: "瘦肉", keys: ["sàn-bah", "san-bah"], defaultFileName: "sàn-bah.png" },
    { name: "三層肉", keys: ["三層肉", "sam-tsân"], defaultFileName: "三層肉sam-tsân-bah.png" },
    { name: "大同仔", keys: ["大同仔", "tāi-tông"], defaultFileName: "大同仔tāi-tông-á.png" },
    { name: "文旦", keys: ["文旦", "bûn-tàn"], defaultFileName: "文旦bûn-tàn.png" },
    { name: "月娘", keys: ["月娘", "gue̍h-niû"], defaultFileName: "月娘gue̍h-niû.png" },
    { name: "月餅", keys: ["月餅", "gue̍h-piánn"], defaultFileName: "月餅gue̍h-piánn.png" },
    { name: "牛排", keys: ["牛排", "gû-pâi"], defaultFileName: "牛排gû-pâi.png" },
    { name: "玉兔", keys: ["玉兔", "gio̍k-thòo"], defaultFileName: "玉兔挵藥仔gio̍k-thòo tsing-io̍k-á.png" },
    { name: "米血", keys: ["米血", "bí-hueh"], defaultFileName: "米血bí-hueh.png" },
    { name: "卵仁酥", keys: ["卵仁酥", "nñg-jîn"], defaultFileName: "卵仁酥nñg-jîn-soo.png" },
    { name: "金針菇", keys: ["金針菇", "kim-tsiam"], defaultFileName: "金針菇kim-tsiam-koo.png" },
    { name: "俗麭", keys: ["俗麭", "sio̍k-pháng"], defaultFileName: "俗麭sio̍k-pháng.png" },
    { name: "香菇", keys: ["香菇", "hiunn-koo"], defaultFileName: "香菇hiunn-koo.png" },
    { name: "烘爐", keys: ["烘爐", "hang-lôo"], defaultFileName: "烘爐hang-lôo.png" },
    { name: "茭白筍", keys: ["茭白筍", "茭", "kha-pe̍h-sún"], defaultFileName: "茭白筍kha-pe̍h-sún.png" },
    { name: "蚵仔", keys: ["蚵仔", "ô-á"], defaultFileName: "蚵仔ô-á.png" },
    { name: "蚶仔", keys: ["蚶仔", "蚶", "ham-á"], defaultFileName: "蚶仔ham-á.png" },
    { name: "透抽", keys: ["透抽", "thàu-thiu"], defaultFileName: "透抽thàu-thiu.png" },
    { name: "棉仔糖", keys: ["棉仔糖", "mî-á"], defaultFileName: "棉仔糖mî-á thn̂g.png" },
    { name: "番仔火", keys: ["番仔火", "huan-á-hué"], defaultFileName: "番仔火huan-á-hué.png" },
    { name: "番麥", keys: ["番麥", "huan-be̍h"], defaultFileName: "番麥huan-be̍h.png" },
    { name: "番薯", keys: ["番薯", "han-tsî"], defaultFileName: "番薯han-tsî.png" },
    { name: "黑輪", keys: ["黑輪", "oo-lián"], defaultFileName: "黑輪oo-lián.png" },
    { name: "煙火", keys: ["煙火", "ian-hué"], defaultFileName: "煙火ian-hué.png" },
    { name: "煙腸", keys: ["煙腸", "ian-tshiâng"], defaultFileName: "煙腸ian-tshiâng.png" },
    { name: "嫦娥", keys: ["嫦娥", "Siông-ngôo"], defaultFileName: "嫦娥Siông-ngôo.png" },
    { name: "綠豆膨", keys: ["綠豆膨", "綠豆", "膨", "li̍k-tāu-phòng"], defaultFileName: "綠豆膨li̍k-tāu-phòng.png" },
    { name: "蝦仔", keys: ["蝦仔", "hê-á"], defaultFileName: "蝦仔hê-á.png" },
    { name: "蟳仔", keys: ["蟳仔", "tsîm-á"], defaultFileName: "蟳仔tsîm-á.png" },
    { name: "火炭", keys: ["火炭", "hué-thuànn"], defaultFileName: "火炭hué-thuànn.png" }
  ];

  let imageList = [];
  let deck = [];
  let currentRound = 0;
  let teamScores = [];
  let currentCards = [null, null];

  const preloadedImageCache = {};

  function preloadAllAssets(items) {
    const statusTag = document.getElementById('gallery-status');
    let loadedCount = 0;
    const total = items.length;

    if (total === 0) {
      if (statusTag) statusTag.innerText = `已備 0 張圖`;
      return;
    }

    items.forEach(item => {
      const img = new Image();
      img.onload = () => {
        loadedCount++;
        preloadedImageCache[item.name] = img.src;
        if (statusTag) statusTag.innerText = `⚡ 快取中 (${loadedCount}/${total})`;
        if (loadedCount === total && statusTag) {
          statusTag.innerText = `🚀 ${total}張圖全數就緒！`;
        }
      };
      img.onerror = () => {
        if (item.fallbackLocal && img.src !== item.fallbackLocal) {
          img.src = item.fallbackLocal;
        } else {
          loadedCount++;
          if (loadedCount === total && statusTag) {
            statusTag.innerText = `🚀 ${total}張圖全數就緒！`;
          }
        }
      };
      img.src = item.src;
    });
  }

  async function fetchImagesFromGitHub() {
    const statusTag = document.getElementById('gallery-status');
    if (statusTag) statusTag.innerText = "⚡ 正在連線圖庫...";

    const currentTheme = document.getElementById('theme-select').value;
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const repoName = pathParts[0] || 'spot-it-game';
    const ownerName = window.location.hostname.split('.')[0] || 'Biau7ling5-taiwanese';

    const localBase = `theme/${currentTheme}/`;
    const apiUrl = `https://api.github.com/repos/${ownerName}/${repoName}/contents/theme/${currentTheme}`;

    let files = [];
    try {
      const res = await fetch(apiUrl);
      if (res.ok) files = await res.json();
    } catch (e) {
      console.warn("API 取得目錄失敗，切換內建備援解析：", e);
    }

    if (Array.isArray(files) && files.length > 0) {
      const normalizedFiles = files.map(f => ({
        originalName: f.name,
        nfc: f.name.normalize('NFC'),
        nfd: f.name.normalize('NFD')
      }));

      imageList = itemDefinitions.map((def, idx) => {
        const matched = normalizedFiles.find(f => {
          return def.keys.some(k => {
            const knfc = k.normalize('NFC');
            const knfd = k.normalize('NFD');
            return f.nfc.includes(knfc) || f.nfd.includes(knfd);
          });
        });

        const finalFileName = matched ? matched.originalName : def.defaultFileName;

        return {
          id: `sym_${idx}`,
          name: def.name,
          src: localBase + encodeURIComponent(finalFileName),
          fallbackLocal: localBase + encodeURIComponent(def.defaultFileName)
        };
      });
    } else {
      imageList = itemDefinitions.map((def, idx) => ({
        id: `sym_${idx}`,
        name: def.name,
        src: localBase + encodeURIComponent(def.defaultFileName),
        fallbackLocal: localBase + encodeURIComponent(def.defaultFileName)
      }));
    }

    preloadAllAssets(imageList);
    renderThumbnails();
    resetGame();
  }

  const imgInput = document.getElementById('img-input');
  if (imgInput) {
    imgInput.addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      let processed = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const cleanName = file.name.replace(/\.[^/.]+$/, "");
          const newItem = {
            id: Date.now() + Math.random(),
            src: evt.target.result,
            name: cleanName
          };
          imageList.push(newItem);
          preloadedImageCache[cleanName] = evt.target.result;
          processed++;

          if (processed === files.length) {
            renderThumbnails();
            resetGame();
            const drawer = document.getElementById('thumb-container');
            if (drawer) drawer.style.display = 'flex';
          }
        };
        reader.readAsDataURL(file);
      });
      this.value = '';
    });
  }

  function renderThumbnails() {
    const container = document.getElementById('thumb-container');
    if (!container) return;
    container.innerHTML = '';
    imageList.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'thumb-item';
      div.title = item.name;
      const displaySrc = preloadedImageCache[item.name] || item.src;
      div.innerHTML = `
        <img src="${displaySrc}" alt="${item.name}">
        <button class="thumb-del" onclick="removeSingleImage(${idx})" title="刪除此圖片">×</button>
      `;
      container.appendChild(div);
    });

    const modeSelect = document.getElementById('mode-select');
    const n = modeSelect ? parseInt(modeSelect.value) : 5;
    const required = n * n + n + 1;
    const statusTag = document.getElementById('gallery-status');
    if (statusTag) statusTag.innerText = `已備 ${imageList.length} / ${required} 張圖`;
  }

  function removeSingleImage(index) {
    const removed = imageList.splice(index, 1)[0];
    if (removed) delete preloadedImageCache[removed.name];
    renderThumbnails();
    resetGame();
  }

  function clearAllImages() {
    if (confirm("確定要清空目前圖片嗎？（將切換為純文字卡模式，點擊 🔄 可隨時復原圖庫）")) {
      imageList = [];
      Object.keys(preloadedImageCache).forEach(key => delete preloadedImageCache[key]);
      renderThumbnails();
      resetGame();
    }
  }

  function toggleThumbList() {
    const container = document.getElementById('thumb-container');
    if (!container) return;
    const isHidden = window.getComputedStyle(container).display === 'none';
    container.style.display = isHidden ? 'flex' : 'none';
  }

  function toggleScoreboardPanel() {
    const panel = document.getElementById('scoreboard-panel');
    const btn = document.getElementById('btn-toggle-score');
    if (!panel) return;
    const isHidden = window.getComputedStyle(panel).display === 'none';
    panel.style.display = isHidden ? 'block' : 'none';
    if (btn) btn.classList.toggle('active', isHidden);

    setTimeout(() => {
      if (currentCards[0] && currentCards[1]) {
        renderDisk('disk-left', currentCards[0]);
        renderDisk('disk-right', currentCards[1]);
      }
    }, 220);
  }

  function buildProjectivePlane(n) {
    const cards = [];
    const c1 = [];
    for (let i = 0; i <= n; i++) c1.push(i);
    cards.push(c1);

    for (let j = 0; j < n; j++) {
      const card = [0];
      for (let k = 0; k < n; k++) card.push((n + 1) + n * j + k);
      cards.push(card);
    }

    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        const card = [i + 1];
        for (let k = 0; k < n; k++) card.push((n + 1) + n * k + ((i * k + j) % n));
        cards.push(card);
      }
    }
    return cards;
  }

  function resetGame() {
    const modeSelect = document.getElementById('mode-select');
    const n = modeSelect ? parseInt(modeSelect.value) : 5;
    const baseCards = buildProjectivePlane(n);
    deck = [...baseCards].sort(() => Math.random() - 0.5);
    currentRound = 0;
    currentCards = [null, null];
    updateRoundBadge();
    const dl = document.getElementById('disk-left');
    const dr = document.getElementById('disk-right');
    if (dl) dl.innerHTML = `<span class="empty-msg">點擊「🎲」下一題</span>`;
    if (dr) dr.innerHTML = `<span class="empty-msg">點擊「🎲」下一題</span>`;
    stopVictoryMusic();
  }

  function onModeChange() {
    renderThumbnails();
    resetGame();
  }

  function onThemeChange() {
    fetchImagesFromGitHub();
  }

  function updateRoundBadge() {
    const totalInput = document.getElementById('total-rounds');
    const total = totalInput ? (parseInt(totalInput.value) || 20) : 20;
    const badge = document.getElementById('round-indicator');
    if (badge) badge.innerText = `${currentRound} / ${total}`;
  }

  function getDistributedSlots(count, radius) {
    const slots = [];
    if (count === 4) {
      for (let i = 0; i < 4; i++) {
        const ang = (i * 90 + Math.random() * 25) * (Math.PI / 180);
        slots.push({ x: Math.cos(ang) * (radius * 0.50), y: Math.sin(ang) * (radius * 0.50) });
      }
    } else if (count === 6) {
      slots.push({ x: (Math.random() - 0.5) * (radius * 0.15), y: (Math.random() - 0.5) * (radius * 0.15) });
      const offset = Math.random() * 60;
      for (let i = 0; i < 5; i++) {
        const ang = (i * 72 + offset) * (Math.PI / 180);
        slots.push({ x: Math.cos(ang) * (radius * 0.56), y: Math.sin(ang) * (radius * 0.56) });
      }
    } else if (count === 8) {
      slots.push({ x: -(radius * 0.2), y: (Math.random() - 0.5) * (radius * 0.1) });
      slots.push({ x: (radius * 0.2), y: (Math.random() - 0.5) * (radius * 0.1) });
      const offset = Math.random() * 45;
      for (let i = 0; i < 6; i++) {
        const ang = (i * 60 + offset) * (Math.PI / 180);
        slots.push({ x: Math.cos(ang) * (radius * 0.62), y: Math.sin(ang) * (radius * 0.62) });
      }
    }
    return slots;
  }

  function renderDisk(diskId, symbolIds) {
    const disk = document.getElementById(diskId);
    if (!disk) return;
    disk.innerHTML = '';
    
    const rect = disk.getBoundingClientRect();
    const radius = rect.width / 2 || 140;

    const slots = getDistributedSlots(symbolIds.length, radius);
    const shuffled = [...symbolIds].sort(() => Math.random() - 0.5);

    shuffled.forEach((symId, idx) => {
      const slot = slots[idx];
      const el = document.createElement('div');
      el.className = 'symbol-item';

      const baseRatio = symbolIds.length >= 8 ? 0.30 : 0.38;
      const baseSize = radius * baseRatio;
      const scale = 0.8 + Math.random() * 0.5;
      const size = Math.round(baseSize * scale);
      const angle = Math.floor(Math.random() * 121) - 60;

      el.style.width = `${size}px`;
      el.style.height = `${size}px`;
      el.style.left = `${radius + slot.x - size / 2}px`;
      el.style.top = `${radius + slot.y - size / 2}px`;
      el.style.transform = `rotate(${angle}deg)`;

      const currentItem = imageList[symId];
      if (currentItem) {
        const cachedSrc = preloadedImageCache[currentItem.name] || currentItem.src;
        const img = document.createElement('img');
        img.src = cachedSrc;
        img.alt = currentItem.name;
        img.onerror = function() {
          if (this.dataset.fallback !== "1" && currentItem.fallbackLocal) {
            this.dataset.fallback = "1";
            this.src = currentItem.fallbackLocal;
          } else {
            this.style.display = 'none';
            const span = document.createElement('div');
            span.className = 'symbol-fallback';
            span.innerText = currentItem.name || `圖案 ${symId + 1}`;
            el.appendChild(span);
          }
        };
        el.appendChild(img);
      } else {
        const span = document.createElement('div');
        span.className = 'symbol-fallback';
        span.innerText = `圖案 ${symId + 1}`;
        el.appendChild(span);
      }
      disk.appendChild(el);
    });
  }

  function drawNextPair() {
    const totalInput = document.getElementById('total-rounds');
    const totalRounds = totalInput ? (parseInt(totalInput.value) || 20) : 20;
    if (currentRound >= totalRounds) {
      playVictoryMusic();
      return;
    }
    if (deck.length < 2) {
      const modeSelect = document.getElementById('mode-select');
      const n = modeSelect ? parseInt(modeSelect.value) : 5;
      deck = buildProjectivePlane(n).sort(() => Math.random() - 0.5);
    }

    currentCards = [deck.pop(), deck.pop()];
    renderDisk('disk-left', currentCards[0]);
    renderDisk('disk-right', currentCards[1]);

    currentRound++;
    updateRoundBadge();

    if (currentRound === totalRounds) {
      setTimeout(playVictoryMusic, 800);
    }
  }

  function renderScoreboard() {
    const countInput = document.getElementById('team-count');
    const count = countInput ? (parseInt(countInput.value) || 1) : 6;
    const board = document.getElementById('scoreboard');
    if (!board) return;

    while (teamScores.length < count) teamScores.push(0);
    if (teamScores.length > count) teamScores = teamScores.slice(0, count);

    board.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const card = document.createElement('div');
      card.className = 'team-card';
      card.innerHTML = `
        <div class="team-title">第 ${i + 1} 組</div>
        <div class="score-display" id="score-${i}">${teamScores[i]}</div>
        <div>
          <button class="btn-score" onclick="changeScore(${i}, 1)">+</button>
          <button class="btn-score" onclick="changeScore(${i}, -1)">-</button>
        </div>
      `;
      board.appendChild(card);
    }
  }

  function changeScore(idx, delta) {
    teamScores[idx] = Math.max(0, teamScores[idx] + delta);
    const scoreEl = document.getElementById(`score-${idx}`);
    if (scoreEl) scoreEl.innerText = teamScores[idx];
  }

  // 🎵 頒獎音樂（theme/victory.mp3，具備雲端備援）
  const victoryAudio = new Audio('theme/victory.mp3');
  victoryAudio.volume = 0.95;
  victoryAudio.onerror = function() {
    victoryAudio.src = 'https://ia800301.us.archive.org/15/items/250-years-of-great-music/13%20Marche%20Militaire.mp3';
  };

  let isMusicPlaying = false;
  function playVictoryMusic() {
    try {
      victoryAudio.currentTime = 0;
      victoryAudio.play().then(() => {
        isMusicPlaying = true;
        const btn = document.getElementById('btn-podium-music');
        if (btn) btn.classList.add('playing');
      }).catch(e => console.log("播放政策攔截：", e));
    } catch (e) {}
  }

  function stopVictoryMusic() {
    try {
      victoryAudio.pause();
      victoryAudio.currentTime = 0;
      isMusicPlaying = false;
      const btn = document.getElementById('btn-podium-music');
      if (btn) btn.classList.remove('playing');
    } catch (e) {}
  }

  function toggleVictoryMusic() {
    if (isMusicPlaying) {
      stopVictoryMusic();
    } else {
      playVictoryMusic();
    }
  }

  victoryAudio.onended = function() {
    isMusicPlaying = false;
    const btn = document.getElementById('btn-podium-music');
    if (btn) btn.classList.remove('playing');
  };

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
      e.preventDefault();
      drawNextPair();
    }
  });

  let resizeTimeout;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      if (currentCards[0] && currentCards[1]) {
        renderDisk('disk-left', currentCards[0]);
        renderDisk('disk-right', currentCards[1]);
      }
    }, 150);
  });

  function safeInit() {
    try {
      renderScoreboard();
    } catch (e) {
      console.error("計分板初始化失敗：", e);
    }
    try {
      fetchImagesFromGitHub();
    } catch (e) {
      console.error("圖庫載入失敗：", e);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', safeInit);
  } else {
    safeInit();
  }
</script>
</body>
</html>
